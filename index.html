<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generador de QR - InstantQR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/x-icon" href="./src/qr-code.svg" />
  </head>

  <script
    defer
    src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"
    integrity="sha512-CNgIRecGo7nphbeZ04Sc13ka07paqdeTu0WR1IM4kNcpmBAUSHSQX0FslNhTDadL4O5SAGapGt4FodqL8My0mA=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  ></script>
  <script defer src="app.js"></script>
  <body>
    <section class="contenedor">
      <h1 class="contenedor-titulo">Inst4nt_QR</h1>
      <form id="formulario" class="formulario">
        <input
          class="input-contenedor"
          type="text"
          id="link"
          placeholder="Pega aquí el enlace"
        />
        <button class="btn" type="submit" value="Generar QR">Generar QR</button>
      </form>

      <!-- boton de descarga -->
      <button class="download" type="submit" id="descargar-btn">
        Descargar QR
      </button>

      <section class="contenedorQR-padre">
        <div id="contenedorQR" class="contenedorQR"></div>
      </section>

      <!-- Contenedor del QR -->
    </section>

    <!-- Modal de advertencia -->
    <!-- Modal Dinámico -->
    <div id="modal" class="modal-overlay">
      <div class="modal-contenido">
        <h3 id="modal-titulo">¡Atención!</h3>
        <p id="modal-texto">Mensaje de advertencia...</p>
        <button id="modal-cerrar" class="btn-modal">Entendido</button>
      </div>
    </div>
  </body>
</html>
